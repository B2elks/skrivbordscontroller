<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
  <title>Skrivbordet — kopplingsschema</title>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="320" y="40" font-size="22" font-weight="bold">Skrivbordet — koppling</text>
  <text x="320" y="66" font-size="14" fill="#444444">ESP32-C3 SuperMini → tvåkanals relämodul → bordets upp-/nedknappar</text>

  <!-- USB-laddare -->
  <rect x="40" y="60" width="220" height="70" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <text x="150" y="90" font-size="16" font-weight="bold" text-anchor="middle">USB-laddare</text>
  <text x="150" y="114" font-size="14" text-anchor="middle">5 V, minst 1 A</text>
  <polyline points="60,130 60,165 18,165 18,335 32,335" fill="none" stroke="#777777" stroke-width="6" stroke-linejoin="round"/>
  <text x="75" y="160" font-size="14" fill="#444444">USB-kabel (ström)</text>

  <!-- ESP32-C3 SuperMini -->
  <rect x="40" y="200" width="260" height="260" rx="8" fill="#e8f0fb" stroke="#2b4f80" stroke-width="2"/>
  <rect x="30" y="320" width="22" height="30" rx="3" fill="#9aa5b1" stroke="#2b4f80" stroke-width="1.5"/>
  <text x="50" y="228" font-size="16" font-weight="bold">ESP32-C3 SuperMini</text>
  <text x="60" y="340" font-size="14">USB-C</text>
  <text x="290" y="255" font-size="15" font-weight="bold" text-anchor="end">5V</text>
  <text x="290" y="305" font-size="15" font-weight="bold" text-anchor="end">GND</text>
  <text x="290" y="355" font-size="15" font-weight="bold" text-anchor="end">GPIO5</text>
  <text x="290" y="405" font-size="15" font-weight="bold" text-anchor="end">GPIO6</text>
  <text x="50" y="428" font-size="13" fill="#444444">Lämna GPIO8 och GPIO9</text>
  <text x="50" y="446" font-size="13" fill="#444444">fria (strapping-pinnar)</text>

  <!-- Ledare ESP32 → relämodul -->
  <line x1="300" y1="250" x2="420" y2="250" stroke="#d62728" stroke-width="4"/>
  <line x1="300" y1="300" x2="420" y2="300" stroke="#111111" stroke-width="4"/>
  <line x1="300" y1="350" x2="420" y2="350" stroke="#f07800" stroke-width="4"/>
  <line x1="300" y1="400" x2="420" y2="400" stroke="#d4a000" stroke-width="4"/>
  <text x="360" y="342" font-size="13" text-anchor="middle" fill="#444444">styr UPP</text>
  <text x="360" y="392" font-size="13" text-anchor="middle" fill="#444444">styr NER</text>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="300" cy="250" r="5"/><circle cx="300" cy="300" r="5"/>
    <circle cx="300" cy="350" r="5"/><circle cx="300" cy="400" r="5"/>
    <circle cx="420" cy="250" r="5"/><circle cx="420" cy="300" r="5"/>
    <circle cx="420" cy="350" r="5"/><circle cx="420" cy="400" r="5"/>
  </g>

  <!-- Relämodul -->
  <text x="535" y="190" font-size="15" font-weight="bold" text-anchor="middle">Relämodul, 2 kanaler (5 V)</text>
  <rect x="420" y="200" width="230" height="260" rx="8" fill="#eef7ee" stroke="#2f6b35" stroke-width="2"/>
  <text x="432" y="255" font-size="15" font-weight="bold">VCC</text>
  <text x="432" y="305" font-size="15" font-weight="bold">GND</text>
  <text x="432" y="355" font-size="15" font-weight="bold">IN1</text>
  <text x="432" y="405" font-size="15" font-weight="bold">IN2</text>
  <rect x="490" y="220" width="100" height="90" rx="4" fill="#ffffff" stroke="#2f6b35" stroke-width="1.5"/>
  <text x="540" y="262" font-size="14" font-weight="bold" text-anchor="middle">Relä 1</text>
  <text x="540" y="282" font-size="13" text-anchor="middle">UPP</text>
  <rect x="490" y="340" width="100" height="90" rx="4" fill="#ffffff" stroke="#2f6b35" stroke-width="1.5"/>
  <text x="540" y="382" font-size="14" font-weight="bold" text-anchor="middle">Relä 2</text>
  <text x="540" y="402" font-size="13" text-anchor="middle">NER</text>
  <g stroke="#2f6b35" stroke-width="1.5">
    <line x1="590" y1="240" x2="650" y2="240"/><line x1="590" y1="290" x2="650" y2="290"/>
    <line x1="590" y1="360" x2="650" y2="360"/><line x1="590" y1="410" x2="650" y2="410"/>
  </g>
  <text x="646" y="233" font-size="13" font-weight="bold" text-anchor="end">COM</text>
  <text x="646" y="283" font-size="13" font-weight="bold" text-anchor="end">NO</text>
  <text x="646" y="353" font-size="13" font-weight="bold" text-anchor="end">COM</text>
  <text x="646" y="403" font-size="13" font-weight="bold" text-anchor="end">NO</text>

  <!-- Bordets knappsats -->
  <rect x="760" y="160" width="220" height="300" rx="8" fill="#fbf4e8" stroke="#8a5a14" stroke-width="2"/>
  <text x="870" y="186" font-size="16" font-weight="bold" text-anchor="middle">Bordets knappsats</text>
  <text x="870" y="206" font-size="13" text-anchor="middle" fill="#444444">lågspänning, styrsignal</text>
  <!-- Ledare relä → knappar -->
  <line x1="650" y1="240" x2="820" y2="240" stroke="#1f5fbf" stroke-width="4"/>
  <line x1="650" y1="290" x2="820" y2="290" stroke="#1f5fbf" stroke-width="4"/>
  <line x1="650" y1="360" x2="820" y2="360" stroke="#1a8a3a" stroke-width="4"/>
  <line x1="650" y1="410" x2="820" y2="410" stroke="#1a8a3a" stroke-width="4"/>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="650" cy="240" r="5"/><circle cx="650" cy="290" r="5"/>
    <circle cx="650" cy="360" r="5"/><circle cx="650" cy="410" r="5"/>
  </g>

  <!-- UPP-knapp: två kontakter, sluts när knappen trycks -->
  <g stroke="#333333" stroke-width="3" fill="none">
    <line x1="820" y1="240" x2="850" y2="240"/>
    <line x1="820" y1="290" x2="850" y2="290"/>
    <line x1="866" y1="232" x2="866" y2="298"/>
    <line x1="866" y1="265" x2="890" y2="265"/>
    <line x1="820" y1="360" x2="850" y2="360"/>
    <line x1="820" y1="410" x2="850" y2="410"/>
    <line x1="866" y1="352" x2="866" y2="418"/>
    <line x1="866" y1="385" x2="890" y2="385"/>
  </g>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="820" cy="240" r="5"/><circle cx="820" cy="290" r="5"/>
    <circle cx="820" cy="360" r="5"/><circle cx="820" cy="410" r="5"/>
  </g>
  <rect x="890" y="253" width="18" height="24" rx="3" fill="#8a5a14"/>
  <rect x="890" y="373" width="18" height="24" rx="3" fill="#8a5a14"/>
  <text x="918" y="271" font-size="18" font-weight="bold">UPP</text>
  <text x="918" y="391" font-size="18" font-weight="bold">NER</text>
  <text x="780" y="440" font-size="13" fill="#444444">reläet parallellt över</text>
  <text x="780" y="455" font-size="13" fill="#444444">knappens två kontakter</text>

  <!-- Teckenförklaring och varningar -->
  <g stroke-width="5">
    <line x1="40" y1="510" x2="70" y2="510" stroke="#d62728"/>
    <line x1="150" y1="510" x2="180" y2="510" stroke="#111111"/>
    <line x1="270" y1="510" x2="300" y2="510" stroke="#f07800"/>
    <line x1="490" y1="510" x2="520" y2="510" stroke="#d4a000"/>
    <line x1="710" y1="510" x2="740" y2="510" stroke="#1f5fbf"/>
    <line x1="40" y1="540" x2="70" y2="540" stroke="#1a8a3a"/>
  </g>
  <text x="78" y="515" font-size="14">5 V</text>
  <text x="188" y="515" font-size="14">GND</text>
  <text x="308" y="515" font-size="14">GPIO5 → IN1 (UPP)</text>
  <text x="528" y="515" font-size="14">GPIO6 → IN2 (NER)</text>
  <text x="748" y="515" font-size="14">relä 1 → UPP-knapp</text>
  <text x="78" y="545" font-size="14">relä 2 → NER-knapp</text>
  <text x="270" y="545" font-size="14" font-weight="bold" fill="#b00020">Mät knappens kontakter med multimeter först. Öppna aldrig 230 V-delen.</text>
  <text x="40" y="575" font-size="14" fill="#444444">Bordet rör sig så länge reläet är draget.</text>
  <text x="40" y="597" font-size="14" fill="#444444">Firmware drar aldrig båda reläerna samtidigt och kapar varje drag vid MAX_MS.</text>
</svg>
